name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v7

      # Setup R
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # Install coverage dependencies
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          coverage <- covr::package_coverage(quiet = FALSE)
          print(coverage)
          covr::to_cobertura(coverage, filename = "cobertura.xml")
          cat(
            sprintf("### R package coverage\n\n**Line coverage:** %.2f%%\n",
                    covr::percent_coverage(coverage)),
            file = Sys.getenv("GITHUB_STEP_SUMMARY"),
            append = TRUE
          )
        shell: Rscript {0}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: cobertura.xml
          if-no-files-found: error

name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v7

      # Setup R
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # Install coverage dependencies
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          coverage <- covr::package_coverage(quiet = FALSE)
          print(coverage)
          covr::to_cobertura(coverage, filename = "cobertura.xml")
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./cobertura.xml
          disable_search: true
          # Codecov attempts a tokenless upload for pull requests from forks.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

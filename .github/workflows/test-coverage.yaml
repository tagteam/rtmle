name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v7

      # Setup R
      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      # Install coverage dependencies
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::htmltools, any::xml2
          needs: coverage

      - name: Test coverage
        run: |
          slowtest_code <- deparse(quote(local({
            Sys.setenv(NOT_CRAN = "true")
            testthat::local_edition(3)
            # Keep tests that look for the source checkout on the instrumented package.
            stopifnot(file.copy("slowtests", tempdir(), recursive = TRUE))
            files <- list.files(file.path(tempdir(), "slowtests"),
                                pattern = "[.][rR]$", full.names = TRUE)
            stopifnot(length(files) > 0L)
            for (file in files) {
              testthat::test_file(file, reporter = "summary", stop_on_failure = TRUE)
            }
          })))
          coverage <- covr::package_coverage(
            quiet = FALSE,
            code = slowtest_code,
            show_code_output = TRUE
          )
          print(coverage)
          covr::to_cobertura(coverage, filename = "cobertura.xml")
          summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY")
          cat(
            sprintf("### R package coverage (including slow tests)\n\n**Line coverage:** %.2f%%\n\n",
                    covr::percent_coverage(coverage)),
            file = summary_file,
            append = TRUE
          )
          source(".github/scripts/coverage-by-function.R")
          write_function_coverage_summary(coverage, summary_file)
        shell: Rscript {0}

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: cobertura.xml
          if-no-files-found: error

name: Extended tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, any::callr, github::jsohlendorff/contICEIPCW@9f248214e0f06b81127de49a871c01593ee7e736
          needs: check

      - name: Run extended tests
        run: Rscript --vanilla sandbox/run-extended-tests.R
